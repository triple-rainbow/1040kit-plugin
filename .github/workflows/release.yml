name: Release

# Publishes packages/mcp to npm as `1040kit` when a v* tag is pushed
# (e.g. v0.1.0). Uses npm trusted publishing: npm exchanges this workflow's
# OIDC token for a short-lived publish credential, so there is no NPM_TOKEN
# secret, and the package gets a provenance attestation. One-time npm-side
# setup: docs/releasing.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1
      - name: Tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./packages/mcp/package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match packages/mcp version $version" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter 1040kit test:pack
      # pnpm pack rewrites workspace: ranges; npm publishes that tarball with
      # OIDC (npm's own trusted-publishing support).
      - name: Pack
        working-directory: packages/mcp
        run: |
          pnpm build
          mkdir -p ../../.release
          pnpm pack --pack-destination ../../.release
      - name: Publish
        run: npm publish .release/1040kit-*.tgz --access public --provenance
